<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio · Pedagogia della disabilità intellettiva · TFA sostegno UniCT</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎓%3C/text%3E%3C/svg%3E">
<style>:root{--bg:#f4f5fb;--card:#fff;--ink:#1d2140;--muted:#6b7090;--line:#e6e8f2;--pri:#5b5fe0;--pri2:#c2389e;--ok:#1fa971;--ko:#e5484d;--warn:#f08a24;--rad:18px;--sh:0 6px 24px rgba(40,44,90,.08)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0}
.app{display:flex;min-height:100vh;background:linear-gradient(90deg,#2a2862 248px,transparent 248px)}
.nav .sh{display:none}
.side{width:248px;flex:0 0 248px;background:linear-gradient(170deg,#24275a 0%,#3b2f7a 55%,#6a2b78 100%);color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;gap:10px;align-items:center;margin:0 6px 18px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#ffb84d,#ff5f8f);display:grid;place-items:center;font-weight:800;font-size:20px;box-shadow:0 4px 14px rgba(255,95,143,.4)}
.brand b{display:block;font-size:14.5px;line-height:1.2}.brand small{opacity:.7;font-size:11.5px}
.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;background:transparent;color:#dfe0ff;text-align:left;font-size:15px;transition:.15s}
.nav:hover{background:rgba(255,255,255,.08);color:#fff}.nav.on{background:rgba(255,255,255,.16);color:#fff;font-weight:600}
.nav .ic{width:22px;text-align:center;font-size:17px}
.side .foot{margin-top:auto;font-size:11.5px;opacity:.65;padding:0 8px}
main{flex:1;min-width:0;padding:28px 34px 60px;max-width:1180px}
h1{font-size:28px;margin:0 0 4px;letter-spacing:-.02em}h2{font-size:20px;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 22px}
.card{background:var(--card);border-radius:var(--rad);box-shadow:var(--sh);padding:22px}
.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.hero{background:linear-gradient(120deg,#5b5fe0 0%,#8e44ad 50%,#e85d75 100%);color:#fff;border-radius:24px;padding:28px 30px;display:flex;gap:28px;align-items:center;flex-wrap:wrap;box-shadow:0 14px 40px rgba(91,95,224,.35);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero h1{font-size:26px}.hero p{margin:4px 0 0;opacity:.9}
.cd{display:flex;gap:10px;margin-top:14px}.cd div{background:rgba(255,255,255,.17);border-radius:14px;padding:10px 12px;min-width:68px;text-align:center;backdrop-filter:blur(4px)}
.cd b{display:block;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}.cd span{font-size:11.5px;opacity:.85;text-transform:uppercase;letter-spacing:.06em}
.ring{position:relative;width:132px;height:132px;flex:0 0 132px;z-index:1}.ring svg{transform:rotate(-90deg)}.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:800;font-size:26px}.ring .v small{display:block;font-size:11px;font-weight:500;opacity:.85}
.btn{background:var(--pri);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn.alt{background:#eef0ff;color:var(--pri)}.btn.w{background:#fff;color:#5b3fb0}.btn.big{padding:14px 22px;font-size:16px}
.btn.ok{background:var(--ok)}.btn.ko{background:var(--ko)}.btn:disabled{opacity:.45;cursor:default;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tcard{border-radius:16px;padding:16px;background:#fff;box-shadow:var(--sh);border-left:6px solid var(--c);cursor:pointer;transition:.15s}
.tcard:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(40,44,90,.13)}
.tcard h3{margin:0 0 10px;font-size:14.5px;line-height:1.3;min-height:38px}
.bar{height:8px;border-radius:8px;background:#eceef6;overflow:hidden}.bar i{display:block;height:100%;border-radius:8px;background:var(--c,var(--pri));transition:width .5s}
.meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:7px}
.src{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.chip{padding:7px 12px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-size:13px;color:var(--ink);display:inline-flex;gap:7px;align-items:center}
.chip:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c,#999)}
.chip.on{background:var(--c,var(--pri));border-color:var(--c,var(--pri));color:#fff}.chip.on:before{background:#fff}
.chip.plain:before{display:none}
.qbox{max-width:820px}
.qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13.5px;color:var(--muted)}
.qtext{font-size:20px;font-weight:650;margin:6px 0 18px;line-height:1.35}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:10px;font-size:15.5px;color:var(--ink);transition:.12s}
.opt:hover:not(:disabled){border-color:var(--pri);background:#f7f7ff}
.opt .k{flex:0 0 28px;height:28px;border-radius:8px;background:#eef0ff;color:var(--pri);display:grid;place-items:center;font-weight:700;font-size:13px}
.opt.right{border-color:var(--ok);background:#e9f8f1}.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--ko);background:#fdeced}.opt.wrong .k{background:var(--ko);color:#fff}
.opt:disabled{cursor:default}
.fb{border-radius:14px;padding:14px 16px;margin:6px 0 14px;animation:pop .25s}
.fb.ok{background:#e9f8f1;border:1px solid #bfe9d5}.fb.ko{background:#fdeced;border:1px solid #f6c6c8}
.ref{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;background:#eef0ff;color:#3f43b5;padding:4px 10px;border-radius:999px;margin-top:8px;font-weight:600}
.approf{display:inline-block;font-size:11.5px;font-weight:700;background:#fff1e0;color:#b45a00;border:1px solid #ffd3a1;padding:3px 9px;border-radius:999px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;color:#fff;background:var(--c)}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.prog{height:6px;background:#e6e8f2;border-radius:6px;overflow:hidden;margin-bottom:16px}.prog i{display:block;height:100%;background:linear-gradient(90deg,#5b5fe0,#c2389e);transition:width .3s}
/* flashcards */
.fcwrap{perspective:1400px;max-width:640px;margin:0 auto}
.fc{position:relative;height:330px;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.3,1);cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 14px 40px rgba(40,44,90,.15)}
.face.front{background:linear-gradient(140deg,var(--c) 0%,#3b2f7a 140%);color:#fff}
.face.front .t{font-size:24px;font-weight:700;line-height:1.3}
.face.back{background:#fff;transform:rotateY(180deg);font-size:17px}
.face .hint{position:absolute;bottom:14px;font-size:12px;opacity:.7}
.face .top{position:absolute;top:14px;left:18px;right:18px;display:flex;justify-content:space-between;font-size:12px}
.boxes{display:flex;gap:4px}.boxes i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.35)}.boxes i.f{background:#fff}
.back .boxes i{background:#e3e5f0}.back .boxes i.f{background:var(--c)}
.fcbtns{display:flex;justify-content:center;gap:14px;margin-top:22px}
/* timeline */
.tl{position:relative;margin:10px 0 0;padding:6px 0}
.tl:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:linear-gradient(#5b5fe0,#c2389e,#f08a24);border-radius:4px}
.ev{position:relative;width:50%;padding:8px 34px 8px 0;cursor:pointer}
.ev:nth-child(even){margin-left:50%;padding:8px 0 8px 34px}
.ev .dot{position:absolute;right:-11px;top:22px;width:22px;height:22px;border-radius:50%;background:#fff;border:5px solid var(--c);z-index:1;transition:.2s}
.ev:nth-child(even) .dot{left:-11px;right:auto}
.ev .in{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:var(--sh);border-top:4px solid var(--c);transition:.2s}
.ev:hover .in{transform:translateY(-2px)}
.ev .yr{font-weight:800;font-size:22px;color:var(--c)}.ev .ti{font-weight:650}
.ev .det{display:none;margin-top:8px;font-size:14.5px;color:#3a3f60}
.ev.open .det{display:block;animation:pop .2s}.ev.open .dot{transform:scale(1.25)}
/* maps */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.mthumb{background:#fff;border-radius:16px;overflow:hidden;box-shadow:var(--sh);cursor:zoom-in;transition:.15s;text-align:left;padding:0;color:var(--ink)}
.mthumb:hover{transform:translateY(-3px)}
.mthumb img{width:100%;aspect-ratio:1.414;object-fit:cover;display:block;border-bottom:1px solid var(--line)}
.mthumb div{padding:10px 12px;font-size:13.5px;font-weight:600}.mthumb small{color:var(--muted);font-weight:500;display:block}
.lb{position:fixed;inset:0;background:#0e0f23;z-index:50;display:none;flex-direction:column}
.lb.on{display:flex}
.lbbar{background:#14152e;display:flex;align-items:center;gap:8px;padding:10px 14px;color:#fff}
.lbbar .t{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbbar button{background:rgba(255,255,255,.13);color:#fff;border-radius:10px;min-width:40px;height:40px;font-size:18px;padding:0 10px}
.lbbar button:hover{background:rgba(255,255,255,.25)}
.lbview{flex:1;overflow:hidden;position:relative;cursor:grab;touch-action:none}
.lbview.drag{cursor:grabbing}
.lbview img{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;max-width:none}
/* oral */
.oral{max-width:860px}
.oq{font-size:23px;font-weight:700;line-height:1.35;margin:10px 0 18px}
.timer{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.tclock{position:relative;width:120px;height:120px}.tclock svg{transform:rotate(-90deg)}
.tclock .v{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.tclock.end .v{color:var(--ko)}
.model{background:#f6f7ff;border:1px solid #dfe1fb;border-radius:16px;padding:16px 18px;margin-top:16px;animation:pop .25s;font-size:16px}
.rate{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.rate button{width:52px;height:52px;border-radius:14px;background:#fff;border:2px solid var(--line);font-size:18px;font-weight:700;color:var(--ink)}
.rate button:hover{border-color:var(--pri)}.rate button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
/* stats */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.kpi b{display:block;font-size:30px;line-height:1.1;background:linear-gradient(90deg,#5b5fe0,#c2389e);-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi span{color:var(--muted);font-size:13px}
.weak{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.note{font-size:13px;color:var(--muted)}
.hide{display:none!important}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#24275a;color:#fff;padding:10px 18px;border-radius:12px;z-index:60;font-size:14px;animation:pop .2s}
select{font:inherit;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:#fff}
@media (max-width:980px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){
 .app{flex-direction:column;background:none}
 .nav .lg{display:none}.nav .sh{display:inline}
 .side{position:fixed;bottom:0;top:auto;left:0;right:0;width:auto;height:auto;flex-direction:row;padding:6px;z-index:40;gap:2px;justify-content:space-around;border-radius:18px 18px 0 0}
 .brand,.side .foot{display:none}
 .nav{flex-direction:column;gap:2px;padding:6px 4px;font-size:10.5px;flex:1;text-align:center}
 .nav .ic{font-size:19px}
 main{padding:18px 14px 96px}
 .g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr;gap:12px}.kpi b{font-size:24px}
 .hero{padding:22px}.cd div{min-width:58px}.cd b{font-size:22px}
 .tl:before{left:14px}.ev,.ev:nth-child(even){width:100%;margin-left:0;padding:8px 0 8px 38px}
 .ev .dot,.ev:nth-child(even) .dot{left:3px;right:auto}
 .chips{flex-wrap:nowrap;overflow-x:auto;margin:4px -14px 14px;padding:2px 14px 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;flex:0 0 auto}
 .kbd{display:none}.sub{font-size:14px;margin-bottom:12px}
 .lbbar{flex-wrap:wrap;gap:6px;padding:8px}.lbbar .t{flex-basis:100%;order:-1;font-size:14px}.lbbar button{flex:1}
 .qtext{font-size:18px}.fc{height:360px}.oq{font-size:19px}
}
</style></head><body>

const TOPICS=[
 {id:"ling",short:"Linguaggio",name:"Linguaggio (Gelati)",color:"#e85d75",src:"C"},
 {id:"oms",short:"Modelli OMS",name:"Modelli OMS: ICD → ICF-CY",color:"#f08a24",src:"C"},
 {id:"storia",short:"Fasi e leggi",name:"Fasi storiche e leggi 118/71 · 517/77 · 104/92 · 18/2009",color:"#d4a017",src:"C"},
 {id:"bes",short:"DPR 1994 · BES",name:"DPR 1994 e BES",color:"#8bb22a",src:"C"},

 {id:"di182",short:"D.I. 182/2020",name:"D.I. 182/2020",color:"#2f80ed",src:"C"},
 {id:"d62",short:"D.Lgs. 62/2024",name:"D.Lgs. 62/2024 e Progetto di vita",color:"#5b5fe0",src:"C"},
 {id:"pf",short:"PF · ICF · 4 dim.",name:"PF, ICF e 4 dimensioni del PEI",color:"#8e44ad",src:"P"},
 {id:"quadri",short:"Quadri PEI",name:"Quadri del PEI e percorsi A/B/C",color:"#c2389e",src:"P"},

];
// Quiz: [topic, domanda, risposta corretta, [errate], spiegazione, riferimento, approfondimento?]
const C=n=>"Cornice storico-normativa, slide "+n, P=n=>"PEI, slide "+n, U=n=>"Format UDA, slide "+n;
const QUIZ=[
["ling","Secondo la riflessione di Maura Gelati, termini come «idiota» e «deficiente», nel momento in cui furono ideati…","avevano tutt’altro significato rispetto all’offesa che percepiamo oggi",["erano già usati come insulti nel linguaggio comune","erano termini introdotti dalla L. 104/92","erano sigle delle classificazioni OMS"],"Le slide spiegano che questi termini, che oggi suonano come offese, quando furono ideati erano usati da studiosi con un significato diverso.",C(2)],
["ling","Dove compare il termine «idiota» secondo le slide?","Nel titolo di un volume di Séguin",["In un’opera di De Sanctis","Nella L. 104/1992","Nella classificazione ICIDH"],"«Idiota compare nel titolo di un volume di Séguin».",C(2)],
["ling","Con «idiota» Séguin indicava…","un individuo che si isola al punto di non comunicare e richiede un trattamento educativo speciale",["una persona con disabilità motoria","un alunno con svantaggio socio-culturale","chi ha difficoltà di integrazione lavorativa"],"Per Séguin è chi, incapace di rompere la barriera che lo separa dal mondo, richiede un trattamento educativo speciale.",C(2)],
["ling","Chi usa il termine «deficienti» nel titolo di una delle sue opere, riferendosi a soggetti con disabilità intellettiva?","De Sanctis",["Séguin","Maura Gelati","Paulo Freire"],"«Deficienti: De Sanctis lo usa nel titolo di una delle sue opere più interessanti».",C(2)],
["ling","Il termine «handicappato» è l’elemento chiave di quale norma?","L. 5 febbraio 1992, n. 104",["L. 517/1977","L. 118/1971","D.Lgs. 66/2017"],"La legge-quadro 104/92 per l’assistenza, l’integrazione sociale e i diritti delle persone handicappate.",C(3)],
["ling","Secondo la L. 104/92 (come riportata nelle slide) è «handicappato» chi presenta una minorazione fisica, psichica o sensoriale, stabilizzata o progressiva, che…","è causa di difficoltà di apprendimento, di relazione o integrazione lavorativa, tale da determinare svantaggio ed emarginazione",["impedisce qualsiasi attività scolastica","deriva esclusivamente da cause genetiche","è stata accertata dall’INPS"],"Definizione della slide (che per refuso scrive «minoranza» invece di «minorazione»).",C(3)],

["ling","Perché «persona con disabilità» è la definizione corretta?","Perché intende la disabilità come una caratteristica della persona: né un valore aggiunto, né una fragilità",["Perché è la traduzione di «handicap»","Perché sottolinea il deficit","Perché è prevista dalla L. 517/77"],"La disabilità è una caratteristica della persona: né un valore aggiunto, né una fragilità.",C(4)],

["oms","Secondo le slide, in che anno l’OMS ha elaborato l’ICD?","1970",["1980","1999","2001"],"Le slide indicano l’ICD nel 1970 (la storia della classificazione è in realtà più lunga: vedi approfondimento nei riassunti).",C(5)],
["oms","L’ICIDH risale al…","1980, ed è rimasto in uso fino al 1999",["1970, in uso fino al 2001","1999, in uso fino al 2007","2001, ancora in uso"],"ICIDH nel 1980 e in uso fino al 1999.",C(5)],
["oms","In che anno è stato elaborato l’ICF?","2001",["1999","2007","1980"],"ICF (International Classification of Functioning, Disability and Health) nel 2001.",C(5)],

const OPEN=[
["ling","Perché termini come «idiota» e «deficiente» non vanno letti solo come offese?","Secondo la riflessione di Maura Gelati, quando furono ideati erano termini scientifici: Séguin usava «idiota» per l’individuo che si isola al punto da non comunicare e richiede un trattamento educativo speciale; De Sanctis usava «deficienti» per i soggetti con disabilità intellettiva. Il loro significato è cambiato nel tempo.",C(2)],
["ling","Qual è la definizione corretta oggi e perché «diversamente abile» è criticata?","«Persona con disabilità»: la disabilità è una caratteristica della persona, né un valore aggiunto né una fragilità. «Diversamente abile» è criticata perché presenta, ipocritamente, la disabilità come una ricchezza. Il D.Lgs. 62/2024 (art. 4) aggiorna la terminologia verso «condizione di disabilità» e «persona con disabilità».",C(4)+"; "+C(35)],
["ling","Come definisce l’handicappato la L. 104/1992?","Chi presenta una minorazione fisica, psichica o sensoriale, stabilizzata o progressiva, causa di difficoltà di apprendimento, relazione o integrazione lavorativa, tale da determinare svantaggio ed emarginazione. (La slide scrive per refuso «minoranza».)",C(3)],
["oms","Quali classificazioni ha elaborato l’OMS e in quali anni?","ICD (1970 secondo le slide, oggi ICD-11), ICIDH (1980, in uso fino al 1999), ICIDH-2 (1999), ICF (2001), ICF-CY (2007, Venezia).",C(5)+"–11"],
["oms","Qual era il limite dell’ICIDH?","L’impostazione medica e la sequenza lineare menomazione → disabilità → handicap, che faceva della menomazione la causa della disabilità e leggeva la persona come vincolata ai suoi limiti, impossibilitata a partecipare e contribuire alla vita sociale.",C(7)],
["oms","Mi parli del passaggio dall’ICIDH all’ICF: che cosa introduce l’ICF?","Si passa da un’impostazione medica (menomazione → disabilità → handicap) a una visione bio-psico-sociale; l’ICIDH-2 (1999) è il trampolino di lancio. Lo stato di salute si descrive considerando dotazione biologica, fattori contestuali (relazioni, culture, ambienti) e dimensione psicologica (autostima, identità, motivazione, autodeterminazione). L’ICF permette di individuare barriere da rimuovere e facilitatori da promuovere per il massimo dell’auto-realizzazione.",C(7)+"–10"],
["oms","Che cos’è l’ICF-CY e cosa aggiunge?","È la prima classificazione derivata dall’ICF, per la fascia 0-18 anni, presentata dall’OMS a Venezia nel 2007. Considera i cambiamenti legati a crescita e sviluppo e le diverse conseguenze, per incidenza e intensità, nell’infanzia, pubertà e adolescenza rispetto all’adulto.",C(11)],
["storia","Illustri le fasi storiche della normativa e le leggi di inserimento, integrazione e inclusione.","Pre-’60: dall’esclusione alla medicalizzazione; ’60-’75: all’inserimento selvaggio; ’70-’90: all’integrazione; post-’90: all’inclusione. Inserimento: art. 28 L. 118/1971; integrazione: L. 517/1977 e L. 104/1992; inclusione: Convenzione ONU ratificata con L. 18/2009 e D.Lgs. 66/2017.",C(13)+"–14"],
["bes","Che cosa stabiliva il DPR 24 febbraio 1994?","Atto di indirizzo e coordinamento sui compiti delle unità sanitarie locali: ha consegnato alle scuole le procedure per l’acquisizione della Diagnosi Funzionale da parte delle ASL e per la redazione del Profilo Dinamico Funzionale e del PEI.",C(15)],
["bes","Chi sono gli alunni BES?","Secondo la Direttiva 27/12/2012 e la C.M. 8/2013: alunni con disabilità (L. 104/92), con disturbi evolutivi specifici (DSA e altri disturbi evolutivi), con svantaggio (deprivazione socio-culturale, background migratorio). Per gli alunni con disabilità si prevedono docente di sostegno e PEI redatto congiuntamente.",C(16)+"–18"],
["d66","Quali sono le principali novità del D.Lgs. 66/2017?","Prospettiva ICF; Profilo di Funzionamento che sostituisce DF e PDF e fonda il PEI; PEI centrale (progettazione, personalizzazione, misure di sostegno e accomodamenti ragionevoli), interdisciplinare e collegiale; nuova architettura GIT-GLI-GLO; finalità: rimozione barriere, personalizzazione, corresponsabilità scuola-famiglia-servizi.",C(19)+"–22"],
["d96","Cosa cambia con il D.Lgs. 96/2019?","Rafforza l’accomodamento ragionevole; passa dalla «disabilità certificata» (atto statico, medico, centrato sul deficit, funzionale alle risorse) alla «condizione di disabilità accertata» (dinamica, situata, frutto dell’interazione persona-contesto); ribadisce l’unità di valutazione multidimensionale; ridimensiona il GIT, rafforza GLI e GLO, valorizza famiglia e studente.",C(23)+"–28"],
["di182","Qual è l’obiettivo del D.I. 182/2020?","Garantire che PF e PEI siano redatti con criteri uniformi su tutto il territorio nazionale (uniformità, chiarezza, completezza), per una progettazione personalizzata e coerente; definisce obiettivi, strategie, risorse, verifica e la modulistica del PEI.",C(29)+"–32"],
["d62","Quali sono le innovazioni del D.Lgs. 62/2024?","Ridefinisce la condizione di disabilità come interazione tra compromissioni e barriere; affida all’INPS l’accertamento (uniformità, semplificazione, superamento delle disuguaglianze regionali) con sperimentazione territoriale; aggiorna la terminologia (art. 4); distingue valutazione di base e valutazione multidimensionale; introduce il progetto di vita individuale, personalizzato e partecipato.",C(33)+"–36"],
["d62","Perché il progetto di vita è «individuale, personalizzato e partecipato»?","Individuale: parte dalla singolarità irriducibile della persona. Personalizzato: progettazione situata, attenta ai contesti e alle transizioni evolutive, non adattamento di servizi standard. Partecipato: la persona è coinvolta nelle decisioni come soggetto epistemico, secondo il principio di autodeterminazione; famiglia e servizi mediano e supportano senza sostituirsi alla sua volontà.",C(37)+"–40"],
["pf","Che rapporto c’è tra Profilo di Funzionamento e PEI?","Il PF, su base ICF, è l’anello di congiunzione tra ambito sanitario ed educativo e descrive come l’alunno funziona nei contesti; il PEI prende in carico queste evidenze e le traduce in obiettivi didattico-educativi, strategie e strumenti sulle quattro dimensioni.",P(2)],
["pf","Quali sono le quattro dimensioni del PEI?","Socializzazione e Interazione; Comunicazione e Linguaggio; Autonomia e Orientamento; Cognitiva, Neuropsicologica e dell’Apprendimento – con i rispettivi contenuti (relazioni; modalità espressive e ricettive; autonomie, orientamento, motricità; attenzione, memoria, stili cognitivi).",P(2)],
["pf","Che cosa sono barriere e facilitatori? Faccia esempi.","Fattori ambientali che rispettivamente ostacolano o migliorano il funzionamento. Facilitatori: sintesi vocale, clima inclusivo, mappe, compagno tutor. Barriere: ambienti rumorosi (ipoacusia, autismo), testi non adattati, atteggiamenti svalutanti. Nel PEI si valutano con i codici e e i qualificatori da 1 a 4.",P(3)+", 18–19"],
["pf","Che differenza c’è tra capacità e performance?","Capacità: ciò che l’alunno fa senza aiuti (es. difficoltà nella lettura autonoma). Performance: ciò che fa con i facilitatori (con sintesi vocale e mappa visiva comprende e rielabora il testo). La differenza mostra il peso del contesto.",P(4)],
["pf","Come si compila il Quadro 4? Faccia un esempio.","Per ogni dimensione: punti di forza/debolezza dal PF, obiettivi, interventi, tecniche e strumenti. Esempio: alunno disattento, b140 e d160; punto di forza: attenzione in attività brevi e motivanti; obiettivo: tempo di attenzione progressivamente maggiore; intervento: attività brevi in sequenza; strumenti: timer visivo, pause programmate, checklist, rinforzo positivo.",P(11)+"–12"],
["pf","Quali codici ICF corrispondono alle quattro dimensioni?","Socializzazione d710-d770; Comunicazione d310-d369 e b310-b340; Autonomia d510-d599 e d410-d489; Cognitiva b140, b144, d160-d179.",P(14)+"–17"],
["quadri","Come funzionano i qualificatori ambientali?","Valori 1-4: lieve, medio, grave/sostanziale, completo; con il segno meno o il punto per le barriere (es. e250 rumore = -3) e il più per i facilitatori (es. e125 software compensativi = +3).",P(18)+"–19"],
["quadri","Che cosa si scrive nei Quadri 5 e 6 e come si possono finanziare i facilitatori?","Q5: mappatura di ambienti fisici, materiali/tecnologie e contesto relazionale con i codici e110-e599. Q6: interventi per abbattere le barriere (cuffie, pannelli fonoassorbenti) e potenziare i facilitatori (formazione CAA, font EasyReading). I facilitatori possono essere finanziati con il Budget di Salute/di Progetto del D.Lgs. 62/2024.",P(19)+"–22"],
["quadri","Qual è la regola fondamentale del Quadro 7?","Gli interventi fuori dalla classe devono essere eccezionali, temporanei e strettamente motivati da bisogni sensoriali, emotivi o di autonomia indicati nel PEI.",P(23)],
["quadri","Distingua i percorsi A, B e C del Quadro 8.","A ordinario: programma della classe con strumenti compensativi/dispensativi, valutazione identica. B personalizzato (obiettivi minimi): programma riconducibile, prove adattate, diritto al diploma. C differenziato: obiettivi non riconducibili ai programmi ministeriali, valutazione sul PEI, attestato di credito formativo (salvo rientro in B). La scelta B/C va legata alla traiettoria del Progetto di vita.",P(24)+"–25"],
["quadri","Che cosa contiene il Quadro 9 e perché è così importante?","Il fabbisogno di risorse per l’anno successivo: ore di sostegno (giustificate su PF e Quadro 4), assistenza specialistica Asacom richiesta all’Ente Locale, trasporto e assistenza igienica. Ha il maggior impatto applicativo: la quantificazione deve basarsi in modo vincolante sulle matrici PF/INPS ed essere in continuità con il Progetto di vita (art. 14 L. 328/2000, D.Lgs. 62/2024).",P(26)+"–27"],
["quadri","Come si adattano le note del Quadro 10 nei tre percorsi?","A: traguardi raggiunti grazie a strumenti compensativi e misure dispensative; B: enunciati rapportati a obiettivi specifici e ridotti; C: enunciati rapportati esclusivamente agli obiettivi di PF e PEI. Principi: coerenza con la Sezione 8 e funzione orientativa per il grado successivo.",P(28)+"–31"],
["quadri","Quando si compilano il Quadro 11 e il Quadro 12?","Q11 a fine anno (entro giugno): verifica degli obiettivi del Q4, efficacia dei facilitatori del Q6, proposta di ore per l’anno dopo. Q12, PEI provvisorio, entro il 30 giugno solo per nuove certificazioni o passaggi di grado, con richiesta provvisoria di risorse per settembre.",P(32)+"–33"],
["oltre","Che cosa cambia per il PEI con il D.Lgs. 62/2024?","Il PEI diventa la sotto-sezione scolastica del Progetto di vita; i dati del Q3 provengono dalla Valutazione di Base INPS; i bisogni extra-didattici confluiscono nella Matrice di Richiedibilità che attiva il Budget di Progetto; gli interventi ASL si sincronizzano con il tempo-scuola; la riconfigurazione del Progetto di vita attiva la revisione straordinaria del PEI.",P(34)+"–41"],
["oltre","Chi attiva e redige il Progetto di vita?","Su richiesta della famiglia (o della persona maggiorenne) al Comune di residenza; si insedia un tavolo di co-progettazione con assistente sociale del Comune, unità valutativa ASL, famiglia (ed eventualmente l’alunno) e scuola (Dirigente o docente del GLO). L’esito è il Progetto di vita sostenuto dal Budget di Salute e di Progetto, che stabilisce le risorse, incluso l’assistente all’autonomia e alla comunicazione.",P(39)],
["uda","Quali sono le voci del format UDA?","Denominazione, utenti destinatari, profilo dello studente con disabilità intellettiva, risorse umane, compito/prodotto, competenze mirate, conoscenze e abilità per disciplina, prerequisiti, strumenti e materiali, metodologie/strategie/tecniche, spazi, arco temporale, cinque fasi.",U(2)+"–15"],

/* ---------- metriche ---------- */
function topicStats(id){
  const qs=QUIZ.map((q,i)=>[q,i]).filter(([q])=>q[0]===id);
  let ans=0,right=0,cor=0,wrong=0;
  qs.forEach(([q,i])=>{const r=S.quiz[i];if(r){ans++;if(r.last)right++;cor+=r.c;wrong+=r.w}});
  const cs=CARDS.map((c,i)=>[c,i]).filter(([c])=>c[0]===id);
  let cardsum=0,known=0;cs.forEach(([c,i])=>{const b=(S.cards[i]||{}).box||0;cardsum+=b?(b-1)/4:0;if(b>=3)known++});
  const os=OPEN.map((o,i)=>[o,i]).filter(([o])=>o[0]===id);
  let osum=0,odone=0;os.forEach(([o,i])=>{const r=S.oral[i];if(r&&r.length){odone++;osum+=r[r.length-1]/5}});
  const qScore=qs.length?right/qs.length:0, cScore=cs.length?cardsum/cs.length:0, oScore=os.length?osum/os.length:0;
  const progress=Math.round(100*(0.5*qScore+0.3*cScore+0.2*oScore));
  const acc=(cor+wrong)?cor/(cor+wrong):null;
  const oralAvg=odone?osum/odone*5:null;
  return {id,nq:qs.length,ans,right,acc,nc:cs.length,known,no:os.length,odone,oralAvg,progress};
}
function allStats(){return TOPICS.map(t=>topicStats(t.id))}
function weakness(st){ // più alto = più debole
  if(st.acc===null&&st.oralAvg===null&&!st.known) return 0.6-st.progress/200;
  let w=0,n=0; if(st.acc!==null){w+=1-st.acc;n++} if(st.oralAvg!==null){w+=1-st.oralAvg/5;n++}
  return (n?w/n:0.5)*0.8+(1-st.progress/100)*0.2;
}
function weakTopics(k,rnd){const s=rnd?shuffle(allStats()):allStats();return s.sort((a,b)=>weakness(b)-weakness(a)).slice(0,k)}

/* ---------- QUIZ ---------- */
let QZ=null;
function chipBar(sel,onchg){
  const w=document.createElement("div");w.className="chips";
  const all=document.createElement("button");all.className="chip plain"+(sel.size===0?" on":"");all.style.setProperty("--c","#5b5fe0");all.textContent="Tutti gli argomenti";
  all.onclick=()=>{sel.clear();onchg()};w.appendChild(all);
  TOPICS.forEach(t=>{const b=document.createElement("button");b.className="chip"+(sel.has(t.id)?" on":"");b.style.setProperty("--c",t.color);b.textContent=t.name;
    b.onclick=()=>{sel.has(t.id)?sel.delete(t.id):sel.add(t.id);onchg()};w.appendChild(b)});
  return w;
}
function vQuiz(m,opt){
  if(opt.weak){startQuiz(weakSet(),"Ripasso dei punti deboli");return}
  const sel=new Set(opt.topics||[]);
  if(opt.autostart){startQuiz(pool(sel,true,10),TBY[[...sel][0]].name);return}
  let n=10,inclA=true;
  const draw=()=>{
    const p=pool(sel,inclA,9999);
    m.innerHTML=`<h1>Quiz</h1><p class="sub">Feedback immediato con spiegazione e riferimento alla slide. Scegli uno o più argomenti.</p><div id="cb"></div>
    <div class="card"><div class="row" style="justify-content:space-between"><div class="row">
     <label>Domande: <select id="nq"><option>5</option><option>10</option><option>20</option><option>40</option><option value="9999">tutte</option></select></label>
     <label class="row" style="gap:6px"><input type="checkbox" id="ia" ${inclA?"checked":""}> includi approfondimenti (non nelle slide)</label></div>
     <div class="row"><span class="note">${p.length} disponibili</span><button class="btn big" id="go">Inizia ▶</button></div></div></div>
     <div class="row" style="margin-top:14px"><button class="btn alt" id="wk">🎯 Ripassa i punti deboli</button><button class="btn alt" id="er">↺ Solo quelle sbagliate</button></div>`;
    $("#cb").appendChild(chipBar(sel,draw));$("#nq").value=String(n);
    $("#nq").onchange=e=>n=+e.target.value;$("#ia").onchange=e=>{inclA=e.target.checked;draw()};
    $("#go").onclick=()=>{const q=pool(sel,inclA,n);if(!q.length)return toast("Nessuna domanda per questa selezione");startQuiz(q,sel.size?[...sel].map(i=>TBY[i].name).join(", "):"Tutti gli argomenti")};
    $("#wk").onclick=()=>startQuiz(weakSet(),"Ripasso dei punti deboli");
    $("#er").onclick=()=>{const q=QUIZ.map((_,i)=>i).filter(i=>S.quiz[i]&&!S.quiz[i].last&&(!sel.size||sel.has(QUIZ[i][0])));if(!q.length)return toast("Nessuna domanda sbagliata da ripassare 👏");startQuiz(shuffle(q).slice(0,n),"Domande sbagliate")};
  };draw();
}
function pool(sel,inclA,n){
  let ids=QUIZ.map((_,i)=>i).filter(i=>(!sel.size||sel.has(QUIZ[i][0]))&&(inclA||!QUIZ[i][6]));
  // priorità: mai viste e sbagliate prima
  ids=shuffle(ids).sort((a,b)=>prio(b)-prio(a));
  return shuffle(ids.slice(0,n));
}
function prio(i){const r=S.quiz[i];if(!r)return 2;if(!r.last)return 3;return r.w>0?1:0}
function weakSet(){
  const wt=weakTopics(3,true).map(s=>s.id);
  const wrong=QUIZ.map((_,i)=>i).filter(i=>S.quiz[i]&&!S.quiz[i].last);
  const rest=pool(new Set(wt),true,15).filter(i=>!wrong.includes(i));
  return shuffle(shuffle(wrong).slice(0,8).concat(rest)).slice(0,15);
}
function startQuiz(ids,label){QZ={ids,i:0,ok:0,label,wrong:[]};renderQ()}
function renderQ(){
  const m=$("#main");const z=QZ;
  if(z.i>=z.ids.length)return endQuiz();
  const qi=z.ids[z.i],q=QUIZ[qi],t=TBY[q[0]];
  const opts=shuffle([{t:q[2],ok:1}].concat(q[3].map(x=>({t:x,ok:0}))));
  m.innerHTML=`<div class="qbox"><div class="qtop"><span>${esc(z.label)}</span><span>${z.i+1} / ${z.ids.length} · ✅ ${z.ok}</span></div>
   <div class="prog"><i style="width:${z.i/z.ids.length*100}%"></i></div>
   <div class="card"><div class="row"><span class="tag" style="--c:${t.color}">${esc(t.name)}</span>${q[6]?approfTag:""}</div>
   <div class="qtext">${esc(q[1])}</div><div id="opts"></div><div id="fb"></div>
   <div class="row" style="justify-content:space-between"><button class="btn alt" id="quit">✕ Termina</button><button class="btn hide" id="next">Avanti →</button></div></div>
   <p class="note kbd">Scorciatoie: tasti 1-4 per rispondere, Invio per proseguire.</p></div>`;
  const box=$("#opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.innerHTML=`<span class="k">${"ABCD"[k]}</span><span>${esc(o.t)}</span>`;b.onclick=()=>answer(k);box.appendChild(b)});
  let done=false;
  function answer(k){if(done)return;done=true;
    const bs=box.querySelectorAll(".opt");bs.forEach((b,j)=>{b.disabled=true;if(opts[j].ok)b.classList.add("right")});
    const ok=!!opts[k].ok;if(!ok)bs[k].classList.add("wrong");
    const r=S.quiz[qi]||{c:0,w:0,last:0};ok?r.c++:r.w++;r.last=ok?1:0;r.t=Date.now();S.quiz[qi]=r;S.log.push([Date.now(),"q",ok?1:0]);if(S.log.length>2000)S.log=S.log.slice(-2000);save();
    if(ok)z.ok++;else z.wrong.push(qi);
    $("#fb").innerHTML=`<div class="fb ${ok?"ok":"ko"}"><b>${ok?"✅ Esatto!":"❌ Non è corretto."}</b> ${ok?"":"Risposta giusta: <b>"+esc(q[2])+"</b>.<br>"}${esc(q[4])}<br>${refTag(q[5])}</div>`;
    $("#next").classList.remove("hide");$("#next").focus();}
  $("#next").onclick=()=>{z.i++;renderQ()};
  $("#quit").onclick=()=>{z.ids=z.ids.slice(0,z.i+(done?1:0));endQuiz()};
  document.onkeydown=e=>{if(!$("#opts"))return;if(!done&&/^[1-4]$/.test(e.key)){answer(+e.key-1)}else if(done&&e.key==="Enter"){e.preventDefault();z.i++;renderQ()}};
}
function endQuiz(){
  document.onkeydown=null;const z=QZ,m=$("#main");const n=z.ids.length,p=n?Math.round(z.ok/n*100):0;
  const msg=p>=90?"Eccellente! 🏆":p>=70?"Molto bene! 💪":p>=50?"Buon lavoro, ripassa gli errori 📚":"Ripassiamo insieme: guarda le spiegazioni 🔁";
  m.innerHTML=`<div class="qbox"><div class="hero"><div style="z-index:1"><h1>${p}% · ${z.ok}/${n}</h1><p>${msg}</p></div></div>
   <div class="row" style="margin:18px 0"><button class="btn" id="again">Nuovo quiz</button>${z.wrong.length?'<button class="btn alt" id="redo">↺ Rifai le sbagliate</button>':""}<button class="btn alt" id="home">Home</button></div>
   ${z.wrong.length?"<h2>Da ripassare</h2>":""}<div id="wl"></div></div>`;
  $("#wl").innerHTML=z.wrong.map(i=>{const q=QUIZ[i];return `<div class="card" style="margin-bottom:12px"><span class="tag" style="--c:${TBY[q[0]].color}">${esc(TBY[q[0]].name)}</span> ${q[6]?approfTag:""}<p style="font-weight:650;margin:10px 0 6px">${esc(q[1])}</p><p style="margin:0">✅ ${esc(q[2])}</p><p class="note" style="margin:6px 0 0">${esc(q[4])}</p>${refTag(q[5])}</div>`}).join("");
  $("#again").onclick=()=>go("quiz");$("#home").onclick=()=>go("home");
  if($("#redo"))$("#redo").onclick=()=>startQuiz(shuffle(z.wrong),"Rifai le sbagliate");
}

/* ---------- FLASHCARD ---------- */
function vFlash(m){
  const sel=new Set();let deck=[],cur=0,flipped=false,seen=0;
  const build=()=>{deck=CARDS.map((_,i)=>i).filter(i=>!sel.size||sel.has(CARDS[i][0]));
    deck=shuffle(deck).sort((a,b)=>((S.cards[a]||{}).box||0)-((S.cards[b]||{}).box||0));seen=0;};
  const draw=()=>{
    m.innerHTML=`<h1>Flashcard</h1><p class="sub">Tocca la carta per girarla, poi indica se la sapevi. Le carte che non sai tornano presto; quelle che sai salgono di livello (ripetizione dilazionata, 5 livelli).</p><div id="cb"></div><div id="fcarea"></div>`;
    $("#cb").appendChild(chipBar(sel,()=>{build();draw()}));show();
  };
  const show=()=>{const a=$("#fcarea");
    if(!deck.length){a.innerHTML=`<div class="card" style="text-align:center;max-width:640px;margin:0 auto"><h2>🎉 Mazzo completato!</h2><p>Hai ripassato ${seen} carte.</p><button class="btn" id="re">Ricomincia</button></div>`;$("#re").onclick=()=>{build();show()};return}
    const ci=deck[0],c=CARDS[ci],t=TBY[c[0]],box=(S.cards[ci]||{}).box||0;flipped=false;
    const dots=k=>`<span class="boxes">${[1,2,3,4,5].map(i=>`<i class="${i<=k?"f":""}"></i>`).join("")}</span>`;
    const known=CARDS.filter((x,i)=>(!sel.size||sel.has(x[0]))&&((S.cards[i]||{}).box||0)>=3).length;
    a.innerHTML=`<div class="fcwrap" style="--c:${t.color}"><div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="note">Nel mazzo: ${deck.length} · Ripassate: ${seen}</span><span class="note">Consolidate (liv. ≥3): ${known}</span></div>
     <div class="fc" id="fc"><div class="face front"><div class="top"><span>${esc(t.name)}</span>${dots(box)}</div><div class="t">${esc(c[1])}</div>${c[4]?'<div style="margin-top:12px"><span class="approf">approfondimento, non nelle slide</span></div>':""}<div class="hint">tocca per girare · spazio</div></div>
     <div class="face back"><div class="top"><span class="note">${esc(t.name)}</span>${dots(box)}</div><div>${esc(c[2])}</div><div>${refTag(c[3])}</div></div></div>
     <div class="fcbtns"><button class="btn ko big" id="no" disabled>✗ Non lo so</button><button class="btn ok big" id="si" disabled>✓ Lo so</button></div></div>`;
    const fc=$("#fc");const flip=()=>{flipped=!flipped;fc.classList.toggle("flip",flipped);$("#no").disabled=$("#si").disabled=false};
    fc.onclick=flip;
    const rate=k=>{const r=S.cards[ci]||{box:0};
      if(k){r.box=Math.min(5,(r.box||1)+1);deck.shift()}else{r.box=1;deck.shift();deck.splice(Math.min(3,deck.length),0,ci)}
      r.t=Date.now();S.cards[ci]=r;S.log.push([Date.now(),"c",k]);save();seen++;show()};
    $("#no").onclick=()=>rate(0);$("#si").onclick=()=>rate(1);
    document.onkeydown=e=>{if(!$("#fc"))return;if(e.key===" "){e.preventDefault();flip()}else if(flipped&&(e.key==="ArrowRight"||e.key==="2"))rate(1);else if(flipped&&(e.key==="ArrowLeft"||e.key==="1"))rate(0)};
  };
  build();draw();
}

/* ---------- TIMELINE ---------- */
function vTimeline(m){
  m.innerHTML=`<h1>Linea del tempo</h1><p class="sub">Leggi e classificazioni in ordine cronologico. Tocca un evento per i dettagli.</p><div class="row" style="margin-bottom:14px"><button class="btn alt" id="exp">Espandi tutto</button></div><div class="tl" id="tl"></div>`;
  const tl=$("#tl");
  TIMELINE.forEach(e=>{const t=TBY[e[3]];const d=document.createElement("div");d.className="ev";d.style.setProperty("--c",t.color);
    d.innerHTML=`<span class="dot"></span><div class="in"><div class="row" style="justify-content:space-between"><span class="yr">${e[0]}</span><span class="tag" style="--c:${t.color}">${esc(t.short)}</span></div><div class="ti">${esc(e[1])}</div><div class="det">${esc(e[2])}<br>${refTag(e[4])}${e[5]?" "+approfTag:""}</div></div>`;
    d.onclick=()=>d.classList.toggle("open");tl.appendChild(d)});
  let all=false;$("#exp").onclick=()=>{all=!all;tl.querySelectorAll(".ev").forEach(x=>x.classList.toggle("open",all));$("#exp").textContent=all?"Comprimi tutto":"Espandi tutto"};
}

/* ---------- MAPPE ---------- */
const pad=n=>String(n).padStart(2,"0");
function vMappe(m){
  m.innerHTML=`<h1>Mappe concettuali</h1><p class="sub">21 mappe costruite sulle slide. Tocca una mappa per aprirla: zoom con rotellina, pinch o pulsanti; trascina per spostarti; frecce per cambiare mappa.</p><div class="mgrid" id="mg"></div>`;
  const g=$("#mg");
  MAPS.forEach((t,i)=>{const b=document.createElement("button");b.className="mthumb";
    const tp=MAPTOPIC[i]?TBY[MAPTOPIC[i]]:null;
    b.innerHTML=`<img loading="lazy" src="img/thumb/mappa-${pad(i+1)}.jpg" alt="Mappa ${i+1}"><div>${i+1}. ${esc(t)}<small>${tp?esc(tp.name):"Visione d’insieme"}</small></div>`;
    b.onclick=()=>openLB(i);g.appendChild(b)});
}
let LB={i:0,s:1,x:0,y:0};
function openLB(i){LB.i=i;$("#lb").classList.add("on");loadLB()}
function loadLB(){const img=$("#lbimg");$("#lbt").textContent=`${LB.i+1}/${MAPS.length} · ${MAPS[LB.i]}`;
  img.onload=fitLB;img.src=`img/mappa-${pad(LB.i+1)}.jpg`;if(img.complete&&img.naturalWidth)fitLB()}
function fitLB(){const v=$("#lbview"),img=$("#lbimg");const s=Math.min(v.clientWidth/img.naturalWidth,v.clientHeight/img.naturalHeight);LB.s=s;LB.fit=s;LB.x=(v.clientWidth-img.naturalWidth*s)/2;LB.y=(v.clientHeight-img.naturalHeight*s)/2;applyLB()}
function applyLB(){$("#lbimg").style.transform=`translate(${LB.x}px,${LB.y}px) scale(${LB.s})`}
function zoomLB(f,cx,cy){const v=$("#lbview");if(cx===undefined){cx=v.clientWidth/2;cy=v.clientHeight/2}
  const ns=Math.max(LB.fit*0.8,Math.min(LB.fit*8,LB.s*f));LB.x=cx-(cx-LB.x)*ns/LB.s;LB.y=cy-(cy-LB.y)*ns/LB.s;LB.s=ns;applyLB()}
function initLB(){
  const v=$("#lbview");let drag=null;const pts=new Map();let pinch=null;
  v.addEventListener("wheel",e=>{e.preventDefault();const r=v.getBoundingClientRect();zoomLB(e.deltaY<0?1.15:1/1.15,e.clientX-r.left,e.clientY-r.top)},{passive:false});
  v.addEventListener("pointerdown",e=>{v.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size===1){drag=[e.clientX-LB.x,e.clientY-LB.y];v.classList.add("drag")}else if(pts.size===2){const p=[...pts.values()];pinch=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1])}});
  v.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===2&&pinch){const p=[...pts.values()],d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]),r=v.getBoundingClientRect();zoomLB(d/pinch,(p[0][0]+p[1][0])/2-r.left,(p[0][1]+p[1][1])/2-r.top);pinch=d}
    else if(drag){LB.x=e.clientX-drag[0];LB.y=e.clientY-drag[1];applyLB()}});
  const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(!pts.size){drag=null;v.classList.remove("drag")}};
  v.addEventListener("pointerup",up);v.addEventListener("pointercancel",up);
  v.addEventListener("dblclick",e=>{const r=v.getBoundingClientRect();if(LB.s>LB.fit*1.5)fitLB();else zoomLB(2.5,e.clientX-r.left,e.clientY-r.top)});
  $("#lbin").onclick=()=>zoomLB(1.3);$("#lbout").onclick=()=>zoomLB(1/1.3);$("#lbfit").onclick=fitLB;
  $("#lbprev").onclick=()=>{LB.i=(LB.i+MAPS.length-1)%MAPS.length;loadLB()};$("#lbnext").onclick=()=>{LB.i=(LB.i+1)%MAPS.length;loadLB()};
  $("#lbx").onclick=()=>$("#lb").classList.remove("on");
  window.addEventListener("resize",()=>{if($("#lb").classList.contains("on"))fitLB()});
  document.addEventListener("keydown",e=>{if(!$("#lb").classList.contains("on"))return;if(e.key==="Escape")$("#lbx").click();if(e.key==="ArrowRight")$("#lbnext").click();if(e.key==="ArrowLeft")$("#lbprev").click();if(e.key==="+")zoomLB(1.3);if(e.key==="-")zoomLB(1/1.3)});
}

/* ---------- ORALE ---------- */
const DUR=180;let T={left:DUR,run:false};
function stopTimer(){clearInterval(timerId);timerId=null;T.run=false}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.2,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+.3);o.start(a.currentTime+t);o.stop(a.currentTime+t+.3)})}catch(e){}}
function vOrale(m){
  const sel=new Set();let cur=null;
  const pick=()=>{const ids=OPEN.map((_,i)=>i).filter(i=>!sel.size||sel.has(OPEN[i][0]));
    const sc=i=>{const r=S.oral[i];return r&&r.length?r[r.length-1]+r.length*0.3:0};
    const cand=shuffle(ids).sort((a,b)=>sc(a)-sc(b));cur=cand[Math.floor(Math.random()*Math.min(4,cand.length))];};
  const draw=()=>{
    m.innerHTML=`<div class="oral"><h1>Simulazione orale</h1><p class="sub">Domande aperte probabili tratte dai riassunti. Rispondi ad alta voce in 3 minuti, poi confronta con la risposta modello e valutati da 1 a 5.</p><div id="cb"></div><div id="oa"></div></div>`;
    $("#cb").appendChild(chipBar(sel,()=>{pick();draw()}));show();
  };
  const show=()=>{stopTimer();T.left=DUR;const o=OPEN[cur],t=TBY[o[0]];const prev=S.oral[cur]||[];
    const C=2*Math.PI*52;
    $("#oa").innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><span class="tag" style="--c:${t.color}">${esc(t.name)}</span><span class="note">${prev.length?"Già provata "+prev.length+"× · ultimo voto "+prev[prev.length-1]+"/5":"Mai provata"}</span></div>
     <div class="oq">«${esc(o[1])}»</div>
     <div class="timer"><div class="tclock" id="tc"><svg width="120" height="120"><circle cx="60" cy="60" r="52" stroke="#eceef6" stroke-width="10" fill="none"/><circle id="tcc" cx="60" cy="60" r="52" stroke="url(#gr)" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/><defs><linearGradient id="gr"><stop offset="0" stop-color="#5b5fe0"/><stop offset="1" stop-color="#c2389e"/></linearGradient></defs></svg><div class="v" id="tv">3:00</div></div>
      <div class="row"><button class="btn big" id="ts">▶ Avvia timer</button><button class="btn alt" id="tr">↺</button></div></div>
     <div class="row" style="margin-top:18px"><button class="btn alt big" id="show">👁 Mostra risposta modello</button><button class="btn alt" id="nx">Prossima domanda →</button></div><div id="mod"></div></div>`;
    const upd=()=>{$("#tv").textContent=`${Math.floor(T.left/60)}:${String(T.left%60).padStart(2,"0")}`;$("#tcc").setAttribute("stroke-dashoffset",C*(1-T.left/DUR));$("#tc").classList.toggle("end",T.left===0)};
    $("#ts").onclick=()=>{if(T.run){stopTimer();$("#ts").textContent="▶ Riprendi";return}if(T.left===0)T.left=DUR;T.run=true;$("#ts").textContent="⏸ Pausa";
      timerId=setInterval(()=>{if(!$("#tv")){stopTimer();return}T.left--;upd();if(T.left<=0){stopTimer();beep();$("#ts").textContent="▶ Riavvia";toast("⏰ Tempo scaduto!")}},1000)};
    $("#tr").onclick=()=>{stopTimer();T.left=DUR;upd();$("#ts").textContent="▶ Avvia timer"};
    $("#nx").onclick=()=>{pick();show()};
    $("#show").onclick=()=>{stopTimer();$("#ts").textContent="▶ Riprendi";
      $("#mod").innerHTML=`<div class="model"><b>Risposta modello</b><p style="margin:8px 0">${esc(o[2])}</p>${refTag(o[3])}
       <p style="margin:16px 0 4px;font-weight:650">Come è andata? Autovalutati:</p><div class="rate" id="rt">${[1,2,3,4,5].map(k=>`<button data-k="${k}" title="${["","Non la sapevo","Molto incompleta","Sufficiente","Buona","Completa e sicura"][k]}">${k}</button>`).join("")}</div><p class="note">1 = non la sapevo · 3 = sufficiente · 5 = completa e sicura</p></div>`;
      $("#show").disabled=true;
      $("#rt").querySelectorAll("button").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;(S.oral[cur]=S.oral[cur]||[]).push(k);S.log.push([Date.now(),"o",k]);save();
        $("#rt").querySelectorAll("button").forEach(x=>{x.classList.toggle("on",x===b);x.disabled=true});toast(k>=4?"Ottimo! 💪":k>=3?"Bene, ancora un ripasso 📚":"La riproporrò presto 🔁")})};
  };
  pick();draw();
}

/* ---------- STATS ---------- */
function vStats(m){
  const st=allStats();const qa=Object.values(S.quiz);const totC=qa.reduce((a,r)=>a+r.c,0),totW=qa.reduce((a,r)=>a+r.w,0);
  const known=Object.values(S.cards).filter(r=>r.box>=3).length;const ors=Object.values(S.oral).map(r=>r[r.length-1]);
  const pct=x=>x===null?"—":Math.round(x*100)+"%";
  m.innerHTML=`<h1>Statistiche</h1><p class="sub">I progressi sono salvati solo in questo browser (localStorage).</p>
   <div class="grid g4"><div class="card kpi"><b>${qa.length}/${QUIZ.length}</b><span>domande viste</span></div><div class="card kpi"><b>${totC+totW?Math.round(totC/(totC+totW)*100):0}%</b><span>accuratezza quiz (${totC+totW} risposte)</span></div>
   <div class="card kpi"><b>${known}/${CARDS.length}</b><span>flashcard consolidate</span></div><div class="card kpi"><b>${ors.length?(ors.reduce((a,b)=>a+b,0)/ors.length).toFixed(1):"—"}</b><span>media orale (${ors.length}/${OPEN.length} domande)</span></div></div>
   <div class="grid g2" style="margin-top:18px"><div class="card"><h2>🎯 Argomenti più deboli</h2><div id="wk"></div><button class="btn" style="margin-top:14px" id="wb">Ripassa i punti deboli</button></div>
   <div class="card"><h2>❌ Domande sbagliate più spesso</h2><div id="mw"></div></div></div>
   <div class="card" style="margin-top:18px;overflow-x:auto"><h2>Dettaglio per argomento</h2><table><thead><tr><th>Argomento</th><th>Progresso</th><th>Quiz visti</th><th>Accuratezza</th><th>Card ≥ liv.3</th><th>Orale</th></tr></thead><tbody id="tb"></tbody></table></div>
   <div class="card" style="margin-top:18px"><h2>Backup dei progressi</h2><p class="note">Utile per passare i progressi su un altro computer o browser.</p><div class="row"><button class="btn alt" id="ex">⬇ Esporta</button><label class="btn alt">⬆ Importa<input type="file" id="im" accept=".json" class="hide"></label><button class="btn ko" id="rs">Azzera tutto</button></div></div>`;
  const ws=weakTopics(4);
  $("#wk").innerHTML=(qa.length||ors.length)?ws.map(s=>{const t=TBY[s.id];return `<div class="weak"><span class="tag" style="--c:${t.color}">${s.progress}%</span><div style="flex:1"><b style="font-size:14px">${esc(t.name)}</b><div class="note">quiz ${pct(s.acc)} · orale ${s.oralAvg===null?"—":s.oralAvg.toFixed(1)+"/5"}</div></div><button class="btn alt" data-t="${s.id}">Quiz</button></div>`}).join(""):'<p class="note">Fai qualche quiz o simulazione per vedere qui i tuoi punti deboli.</p>';
  $("#wk").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>go("quiz",{topics:[b.dataset.t],autostart:true}));
  const mw=QUIZ.map((q,i)=>[i,S.quiz[i]]).filter(([,r])=>r&&r.w).sort((a,b)=>b[1].w-a[1].w).slice(0,6);
  $("#mw").innerHTML=mw.length?mw.map(([i,r])=>`<div class="weak"><span class="tag" style="--c:var(--ko)">${r.w}×</span><div style="flex:1;font-size:14px">${esc(QUIZ[i][1])}<div class="note">✅ ${esc(QUIZ[i][2])}</div></div></div>`).join(""):'<p class="note">Nessun errore registrato finora.</p>';
  $("#tb").innerHTML=st.map(s=>{const t=TBY[s.id];return `<tr><td><span class="tag" style="--c:${t.color}">${SRCN[t.src]}</span> ${esc(t.name)}</td><td style="min-width:120px"><div class="bar" style="--c:${t.color}"><i style="width:${s.progress}%"></i></div><span class="note">${s.progress}%</span></td><td>${s.ans}/${s.nq}</td><td>${pct(s.acc)}</td><td>${s.known}/${s.nc}</td><td>${s.oralAvg===null?"—":s.oralAvg.toFixed(1)+"/5"} <span class="note">(${s.odone}/${s.no})</span></td></tr>`}).join("");
  $("#wb").onclick=()=>go("quiz",{weak:true});
  $("#ex").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="progressi_perciavalle.json";a.click()};
  $("#im").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.quiz)throw 0;S=d;S.log=S.log||[];save();toast("Progressi importati ✅");go("stats")}catch(x){toast("File non valido")}};r.readAsText(f)};
  $("#rs").onclick=()=>{if(confirm("Vuoi davvero azzerare tutti i progressi salvati in questo browser?")){S={quiz:{},cards:{},oral:{},log:[]};save();go("stats")}};
}

/* ---------- init ---------- */
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>go(b.dataset.v));
initLB();
window.addEventListener("hashchange",()=>{const v=location.hash.slice(1);if(VIEWS.includes(v))go(v)});
go(location.hash.slice(1)||"home");

</script></body></html>
